  <title>Reservations — Dar Zafran Admin</title>

<body data-page="reservations">
<div class="admin-layout">

  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-header">
      <a href="index.html" class="sidebar-logo">
        <span class="sidebar-logo-mark">DZ</span>
        <div class="sidebar-logo-text">
          <span class="sidebar-brand">Dar Zafran</span>
          <span class="sidebar-role">Admin</span>
        </div>
      </a>
    </div>
    <nav class="sidebar-nav" aria-label="Admin navigation">
      <ul class="sidebar-nav-list">
        <li><a href="index.html" class="sidebar-nav-link" data-nav="dashboard"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Overview</a></li>
        <li><a href="reservations.html" class="sidebar-nav-link" data-nav="reservations"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>Reservations<span class="nav-badge hidden" id="pendingBadge">0</span></a></li>
        <li><a href="menu.html" class="sidebar-nav-link" data-nav="menu"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>Menu</a></li>
        <li><a href="categories.html" class="sidebar-nav-link" data-nav="categories"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>Categories</a></li>
        <li><a href="messages.html" class="sidebar-nav-link" data-nav="messages"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>Messages<span class="nav-badge hidden" id="unreadBadge">0</span></a></li>
        <li><a href="media.html" class="sidebar-nav-link" data-nav="media"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>Media</a></li>
        <li><a href="settings.html" class="sidebar-nav-link" data-nav="settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35c-.59.24-1.13.56-1.62.94L5.24 5.33c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Settings</a></li>
        <li><a href="account.html" class="sidebar-nav-link" data-nav="account"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>Account</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html" class="sidebar-view-site" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>View Website</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="topbar-hamburger" id="sidebarToggle" aria-label="Toggle sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <h1 class="topbar-title">Reservations</h1>
      <div class="topbar-actions">
        <a href="../api/reservations/export" id="exportBtn" class="btn btn-secondary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Export CSV
        </a>
      </div>
      <div class="topbar-user">
        <span class="topbar-username" id="adminName">Admin</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="admin-content" style="padding:0;max-width:100%;">
      <!-- Filter bar -->
      <div class="filter-bar">
        <select class="form-select" id="filterStatus" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="cancelled">Cancelled</option>
          <option value="completed">Completed</option>
          <option value="no_show">No Show</option>
        </select>
        <input type="date" class="form-input" id="filterDate" aria-label="Filter by date" style="width:160px">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="search" class="form-input" id="filterSearch" placeholder="Search name, email, reference…">
        </div>
        <button class="btn btn-ghost btn-sm" id="filterReset">Reset</button>
      </div>

      <!-- Table -->
      <div class="card" style="border-radius:0;border-left:none;border-right:none;border-bottom:none;">
        <div class="table-wrap">
          <table class="data-table" aria-label="Reservations list">
            <thead>
              <tr>
                <th>Reference</th>
                <th>Guest</th>
                <th>Date &amp; Time</th>
                <th>Guests</th>
                <th>Occasion</th>
                <th>Status</th>
                <th>Submitted</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="reservationsBody">
              <tr><td colspan="8" class="loading-overlay"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="reservationsPagination"></div>
      </div>
    </main>
  </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Reservation Detail Modal -->
<div class="modal-backdrop" id="reservationModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Reservation Detail</h2>
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-core.js"></script>
<script src="js/admin-reservations.js"></script>
</body>
</html>
