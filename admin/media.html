  <div class="admin-main">
    <header class="admin-topbar">
      <button class="topbar-hamburger" id="sidebarToggle" aria-label="Toggle sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <h1 class="topbar-title">Media Library</h1>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="uploadBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          Upload Images
        </button>
        <input type="file" id="uploadInput" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
      </div>
      <div class="topbar-user">
        <span class="topbar-username" id="adminName">Admin</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="admin-content">
      <div id="mediaAlert" class="alert hidden mb-4"></div>

      <!-- Drop zone -->
      <div class="drop-zone mb-6" id="dropZone">
        <div class="drop-zone-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        </div>
        <p class="font-medium">Drag images here to upload</p>
        <p class="text-sm text-muted mt-2">or <button type="button" class="btn btn-ghost btn-sm" id="dropZoneClick" style="display:inline-flex">click to browse</button></p>
        <p class="text-xs text-muted mt-2">JPEG, PNG, WebP — max 5 MB per file</p>
      </div>

      <!-- Grid -->
      <div class="media-grid" id="mediaGrid">
        <div class="loading-overlay" style="grid-column:1/-1"><div class="loading-spinner"></div></div>
      </div>

      <div class="pagination" id="mediaPagination" style="margin-top:16px"></div>
    </main>
  </div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
