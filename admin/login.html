<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign In — Dar Zafran Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/admin-components.css">
</head>
<body data-page="login">

<div class="login-layout">
  <!-- Brand panel -->
  <div class="login-brand">
    <div class="login-brand-inner">
      <div class="login-logo-mark">DZ</div>
      <div class="login-brand-name">Dar Zafran</div>
      <div class="login-brand-tagline">Ancient craft. Present pleasure.</div>
      <p class="login-brand-desc">
        Restaurant management dashboard.<br>
        Reservations · Menu · Messages · Settings.
      </p>
    </div>
  </div>

  <!-- Form panel -->
  <div class="login-form-panel">
    <div class="login-form-inner">
      <h1 class="login-form-title">Welcome back</h1>
      <p class="login-form-subtitle">Sign in to the admin dashboard</p>

      <div id="loginAlert" class="alert alert-error hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group mb-4">
          <label class="form-label" for="email">Email address</label>
          <input
            class="form-input" id="email" name="email"
            type="email" autocomplete="email"
            placeholder="admin@darzafran.ma"
            required
          >
        </div>

        <div class="form-group mb-6">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input" id="password" name="password"
            type="password" autocomplete="current-password"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary w-full" id="loginBtn">
          Sign in
        </button>
      </form>

      <div class="login-back-link">
        <a href="../index.html">← Back to website</a>
      </div>
    </div>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin-auth.js"></script>
</body>
</html>
